name: Build .deb package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils gnupg pkg-config \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check sources
        run: make check

      - name: Build package
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          arch="$(dpkg --print-architecture)"
          mkdir -p out
          cargo build --release --locked
          ./packaging/build-deb.sh out
          cp "out/eduka-update-system_${version}_${arch}.deb" "out/eduka-update-system_${arch}.deb"
          ./tools/build-cubic-installer.sh out/install-eduka-update-system-cubic.sh
          (cd out && sha256sum *.deb *.sh > SHA256SUMS)
          cat out/SHA256SUMS
          dpkg-deb --info "out/eduka-update-system_${version}_${arch}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: eduka-update-system-deb
          path: out/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" out/*.deb out/*.sh out/SHA256SUMS \
            --title "Eduka-Update-System ${version}" \
            --notes "Install in the Cubic terminal: \`apt install ./eduka-update-system_${version}_amd64.deb\` or run tools/get-eus.sh. See CHANGELOG.md."
